name: Bug report
description: Report reproducible ClipGrid behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, private clipboard contents, or personal conversations."
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.6"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClipGrid version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Copy…\n2. Press…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
